<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data:; frame-src 'none'; object-src 'none';">
  <title>Maintenance — PNP Homes Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/firestore-store.js"></script>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>
  <button class="mobile-nav-toggle" id="nav-toggle">☰</button>

  <div class="portal-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <a href="dashboard.html" class="brand">PNP <span>Homes</span></a>
        <span class="tagline">Property Portal</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"          ><span class="icon">⊞</span> Dashboard</a>
        <a href="properties.html"         ><span class="icon">🏠</span> Properties</a>
        <a href="tenants.html"            ><span class="icon">👥</span> Tenants</a>
        <a href="finances.html"           ><span class="icon">💰</span> Finances</a>
        <a href="maintenance.html" class="active"><span class="icon">🔧</span> Maintenance</a>
        <a href="reports.html"            ><span class="icon">📊</span> Reports</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="sidebar-user-avatar">U</div>
          <div>
            <div class="user-name"  id="sidebar-user-name">Loading…</div>
            <div class="user-email" id="sidebar-user-email"></div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">↩ Sign Out</button>
        <div class="portal-privacy"><a href="https://pnphomes.ca/privacy" target="_blank" rel="noopener">Privacy Policy</a></div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="topbar-title">
          <h1>Maintenance</h1>
          <p id="topbar-date"></p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-gold" id="btn-add-maint">+ New Request</button>
        </div>
      </div>

      <div class="page-body">
        <!-- Stats -->
        <div class="stats-grid mb-6">
          <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="m-total">—</div></div>
          <div class="stat-card danger"><div class="stat-label">Open</div><div class="stat-value" id="m-open">—</div></div>
          <div class="stat-card info"><div class="stat-label">In Progress</div><div class="stat-value" id="m-progress">—</div></div>
          <div class="stat-card success"><div class="stat-label">Completed</div><div class="stat-value" id="m-done">—</div></div>
        </div>

        <!-- Filter buttons -->
        <div class="gap-2 mb-6">
          <button class="btn btn-primary btn-sm filter-btn active" data-filter="all">All</button>
          <button class="btn btn-outline btn-sm filter-btn" data-filter="open">Open</button>
          <button class="btn btn-outline btn-sm filter-btn" data-filter="in_progress">In Progress</button>
          <button class="btn btn-outline btn-sm filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Request cards -->
        <div id="maint-list">
          <div class="empty-state"><div class="empty-icon">🔧</div><h4>Loading…</h4></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Maintenance Modal -->
  <div class="modal-overlay" id="maint-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="maint-modal-title">New Request</h3>
        <button class="modal-close" id="maint-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div id="maint-error" class="alert alert-error"></div>
        <input type="hidden" id="maint-id">
        <div class="form-group">
          <label class="form-label" for="maint-title">Title / Issue</label>
          <input class="form-control" type="text" id="maint-title" placeholder="Dishwasher not draining" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="maint-property">Property</label>
            <select class="form-control" id="maint-property"></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="maint-priority">Priority</label>
            <select class="form-control" id="maint-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="maint-desc">Description</label>
          <textarea class="form-control" id="maint-desc" rows="3" placeholder="Describe the issue in detail…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="maint-status">Status</label>
            <select class="form-control" id="maint-status">
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="maint-cost">Cost (CAD)</label>
            <input class="form-control" type="number" id="maint-cost" min="0" step="10" value="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="maint-contractor">Contractor</label>
          <input class="form-control" type="text" id="maint-contractor" placeholder="Optional">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="maint-cancel">Cancel</button>
        <button class="btn btn-primary" id="maint-save">Save Request</button>
      </div>
    </div>
  </div>

  <script src="js/page-maintenance.js"></script>
</body>
</html>
