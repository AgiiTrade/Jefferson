<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data: https://*.googleusercontent.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none';">
  <title>Sign In — PNP Homes Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=20260513-2"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand">PNP <span>Homes</span></div>
        <div class="sub">Property Management Portal</div>
      </div>

      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in to your portal account</p>

      <div id="inapp-warning" class="alert alert-error">
        Google sign-in is blocked in this app browser. Use email/password below, or open this page in Safari/Chrome.
      </div>
      <div id="login-error" class="alert alert-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-control" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password"
                 placeholder="Your password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="login-btn">Sign In</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button class="btn btn-outline btn-full btn-google" type="button" id="google-login-btn">Continue with Google</button>

      <div class="auth-footer">
        <a href="forgot-password.html">Forgot password?</a>
        &nbsp;·&nbsp;
        <a href="signup.html">Create an account</a>
      </div>
      <div class="auth-footer auth-footer-small">
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </div>
  </div>
  <script src="js/auth-browser.js?v=20260611-1"></script>
  <script src="js/login.js?v=20260611-1"></script>
</body>
</html>
