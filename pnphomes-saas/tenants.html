<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data:; frame-src 'none'; object-src 'none';">
  <title>Tenants — PNP Homes Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/firestore-store.js"></script>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>
  <button class="mobile-nav-toggle" id="nav-toggle">☰</button>

  <div class="portal-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <a href="dashboard.html" class="brand">PNP <span>Homes</span></a>
        <span class="tagline">Property Portal</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"          ><span class="icon">⊞</span> Dashboard</a>
        <a href="properties.html"         ><span class="icon">🏠</span> Properties</a>
        <a href="tenants.html"   class="active"><span class="icon">👥</span> Tenants</a>
        <a href="finances.html"           ><span class="icon">💰</span> Finances</a>
        <a href="maintenance.html"        ><span class="icon">🔧</span> Maintenance</a>
        <a href="reports.html"            ><span class="icon">📊</span> Reports</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="sidebar-user-avatar">U</div>
          <div>
            <div class="user-name"  id="sidebar-user-name">Loading…</div>
            <div class="user-email" id="sidebar-user-email"></div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">↩ Sign Out</button>
        <div class="portal-privacy"><a href="https://pnphomes.ca/privacy" target="_blank" rel="noopener">Privacy Policy</a></div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="topbar-title">
          <h1>Tenants</h1>
          <p id="topbar-date"></p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-gold" id="btn-add-tenant">+ Add Tenant</button>
        </div>
      </div>

      <div class="page-body">
        <div class="card">
          <div class="card-header">
            <h3>All Tenants</h3>
            <span class="text-muted text-small" id="tenant-count"></span>
          </div>
          <div class="card-body" style="padding:0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Name</th><th>Contact</th><th>Property / Unit</th><th>Lease End</th><th>Rent</th><th>Actions</th></tr>
                </thead>
                <tbody id="tenants-tbody">
                  <tr><td colspan="6" class="text-muted text-small" style="text-align:center;padding:24px">Loading…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Tenant Modal -->
  <div class="modal-overlay" id="tenant-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="tenant-modal-title">Add Tenant</h3>
        <button class="modal-close" id="tenant-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div id="tenant-error" class="alert alert-error"></div>
        <form id="tenant-form">
          <input type="hidden" id="tenant-id">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="tenant-first">First Name</label>
              <input class="form-control" type="text" id="tenant-first" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="tenant-last">Last Name</label>
              <input class="form-control" type="text" id="tenant-last" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="tenant-email">Email</label>
              <input class="form-control" type="email" id="tenant-email">
            </div>
            <div class="form-group">
              <label class="form-label" for="tenant-phone">Phone</label>
              <input class="form-control" type="tel" id="tenant-phone" placeholder="416-555-0100">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="tenant-property">Property</label>
              <select class="form-control" id="tenant-property"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="tenant-unit">Unit</label>
              <select class="form-control" id="tenant-unit"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="lease-start">Lease Start</label>
              <input class="form-control" type="date" id="lease-start">
            </div>
            <div class="form-group">
              <label class="form-label" for="lease-end">Lease End</label>
              <input class="form-control" type="date" id="lease-end">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="lease-rent">Monthly Rent (CAD)</label>
            <input class="form-control" type="number" id="lease-rent" min="0" step="50">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="tenant-cancel">Cancel</button>
        <button class="btn btn-primary" id="tenant-save">Save Tenant</button>
      </div>
    </div>
  </div>

  <script src="js/page-tenants.js"></script>
</body>
</html>
